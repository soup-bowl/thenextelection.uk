name: Deploy Site

on:
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "public/**"
      - "package-lock.json"
      - "tsconfig.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Set Signature
        run: echo "VITE_VER=$(git rev-parse --short HEAD)" >> .env.production

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: 📦 Build Site
        run: npm ci && npm run build

      - name: 🚛 Publish Site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy ./dist --project-name=uk-election
